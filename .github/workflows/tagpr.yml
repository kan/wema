name: tagpr

# **リリース PR を作り直し、マージされたらタグを打って release.yml を起動する。**
# 設定は `.tagpr`、手順は CLAUDE.md の「リリース手順」。
#
# 中身は kan/tagpr-scripts の共通の workflow（`scripts/tagpr/.github/workflows/tagpr.yml` が
# その写し）。動き、入力、落ちたときの扱いは tagpr-scripts の README の「The tagpr workflow」。
#
# - main への push ごとに、リリース PR（ブランチ `tagpr-from-v<前の版>`）を main の
#   上に作り直す。`package.json` の版は tagpr が上げ、`package-lock.json` と
#   `CHANGELOG.md` の見出しは `scripts/tagpr/release-prepare.mjs` が直す。落ちた run では
#   リリース PR を draft にし、次に成功した run で ready に戻す
# - リリース PR がマージされると、次の run がマージコミットに annotated のタグを打ち、
#   `release.yml` をそのタグで `workflow_dispatch` する（GITHUB_TOKEN で打ったタグでは
#   `push: tags` が起動しないため）
# - `workflow_dispatch` はリリース PR の作り直し用（`tagpr:minor` を付けた後など）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# **この workflow に `concurrency` を付けない。** 共通の workflow の tagpr のジョブが、
# run を 1 つずつ並べる。同じ名前の group を呼ぶ側にも付けると、GitHub が deadlock として止める
jobs:
  tagpr:
    # **SHA は `scripts/tagpr/` に取り込んだ tagpr-scripts の commit にする。** subtree を
    # 取り込む PR で一緒に上げる（CLAUDE.md「リリース PR（tagpr）の仕組み」）。別の repo の
    # reusable workflow は `actions.lock` では固定されず、Dependabot には上げさせない（dependabot.yml）
    uses: kan/tagpr-scripts/.github/workflows/tagpr.yml@776734198ce4cade40332a9d1772ef8a2fd01c2f
    # 共通の workflow が使える権限の上限。4 つとも書く
    permissions:
      contents: write       # リリース PR のブランチとタグを push する
      pull-requests: write  # リリース PR を作る・更新する
      issues: read          # ラベルを読む
      actions: write        # release.yml を workflow_dispatch する
    with:
      release-workflow: release.yml
