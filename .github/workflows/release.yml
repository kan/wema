name: Release

# タグを npm へ stage し、GitHub Release を作って wema.html を添付する。中身は kan/tagpr-scripts の
# 共通の workflow（動きと入力は scripts/tagpr/README.md の「The npm publish workflow」）。
# stage した版は、メンテナが `npm stage approve <stage ID>` するまで公開されない（CLAUDE.md「リリース手順」）
#
# **このファイルの名前を変えない。** npmjs.com の Trusted Publisher に、この名前で登録してある
# （照合されるのは呼ぶ側のこのファイルの名前）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 1 つのタグに 1 run。止めない（stage の途中で止めると、npm には stage したのに Release が無い版が残る）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # SHA は scripts/tagpr/ に取り込んだ commit と同じにする（ci.yml の verify-subtree.mjs が確かめる）
    uses: kan/tagpr-scripts/.github/workflows/publish-npm.yml@3fb536bb107b6b08940ee49f0a8d5a69e68df211
    permissions:
      contents: write  # checkout と GitHub Release
      id-token: write  # npm の Trusted Publishing
    with:
      # 1 行ずつ `bash -euo pipefail` で走るので、どれかが落ちればそこで止まる。`prepack` が無いので、
      # tgz には `npm run build` の `dist/` がそのまま入る
      check: |
        npm run lint
        npm test
        npm run build
        npm run verify:package
      release-files: dist/wema.html
      access: public
