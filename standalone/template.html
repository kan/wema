<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wema</title>
  <!-- __WEMA_CSS__ -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: sans-serif; }
    body { display: flex; flex-direction: column; }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar button {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .toolbar button:hover { background: #eee; }
    .toolbar button:disabled { opacity: 0.4; cursor: default; }
    .toolbar button:disabled:hover { background: white; }
    .toolbar button.locked { background: #ffcdd2; border-color: #e57373; }
    .toolbar button.viewonly { background: #e3f2fd; border-color: #64b5f6; }

    .toolbar .separator {
      width: 1px;
      height: 24px;
      background: #ddd;
    }

    .toolbar .btn-icon {
      padding: 6px 8px;
    }

    #board-container {
      flex: 1;
      background:
        linear-gradient(90deg, #f0f0f0 1px, transparent 1px),
        linear-gradient(#f0f0f0 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #status {
      margin-left: auto;
      color: #888;
      font-size: 12px;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      color: #888;
      transition: color 0.15s;
    }
    .github-link:hover { color: #333; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="btn-undo" class="btn-icon" title="Undo (Ctrl+Z)" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
    <button id="btn-redo" class="btn-icon" title="Redo (Ctrl+Shift+Z)" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg></button>
    <div class="separator"></div>
    <button id="btn-add">+ Add Note</button>
    <button id="btn-lock"><svg id="lock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Lock</button>
    <button id="btn-viewonly"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Read Only</button>
    <button id="btn-theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="8" x2="22" y2="8"/></svg><span id="theme-label">Default</span></button>
    <div class="separator"></div>
    <button id="btn-align-left" class="btn-icon" title="Align Left" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="2" x2="2" y2="14"/><rect x="4" y="3" width="10" height="3" rx="0.5"/><rect x="4" y="8" width="6" height="3" rx="0.5"/></svg></button>
    <button id="btn-align-center-h" class="btn-icon" title="Align Center" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="1" x2="8" y2="15"/><rect x="3" y="3" width="10" height="3" rx="0.5"/><rect x="5" y="8" width="6" height="3" rx="0.5"/></svg></button>
    <button id="btn-align-right" class="btn-icon" title="Align Right" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="14" y1="2" x2="14" y2="14"/><rect x="2" y="3" width="10" height="3" rx="0.5"/><rect x="6" y="8" width="6" height="3" rx="0.5"/></svg></button>
    <button id="btn-align-top" class="btn-icon" title="Align Top" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="2" x2="14" y2="2"/><rect x="3" y="4" width="3" height="10" rx="0.5"/><rect x="8" y="4" width="3" height="6" rx="0.5"/></svg></button>
    <button id="btn-align-middle-v" class="btn-icon" title="Align Middle" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="8" x2="15" y2="8"/><rect x="3" y="3" width="3" height="10" rx="0.5"/><rect x="8" y="5" width="3" height="6" rx="0.5"/></svg></button>
    <button id="btn-align-bottom" class="btn-icon" title="Align Bottom" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="14" x2="14" y2="14"/><rect x="3" y="2" width="3" height="10" rx="0.5"/><rect x="8" y="6" width="3" height="6" rx="0.5"/></svg></button>
    <div class="separator"></div>
    <button id="btn-dist-h" class="btn-icon" title="Distribute Horizontal" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="3" height="8" rx="0.5"/><rect x="6.5" y="4" width="3" height="8" rx="0.5"/><rect x="12" y="4" width="3" height="8" rx="0.5"/></svg></button>
    <button id="btn-dist-v" class="btn-icon" title="Distribute Vertical" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="1" width="8" height="3" rx="0.5"/><rect x="4" y="6.5" width="8" height="3" rx="0.5"/><rect x="4" y="12" width="8" height="3" rx="0.5"/></svg></button>
    <button id="btn-autolayout" title="Auto Layout" disabled>Auto Layout</button>
    <div class="separator"></div>
    <button id="btn-export">Export JSON</button>
    <button id="btn-import">Import JSON</button>
    <span id="status"></span>
    <a class="github-link" href="https://github.com/kan/wema" target="_blank" rel="noopener" title="GitHub"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
  </div>
  <div id="board-container"></div>

  <input type="file" id="file-input" accept=".json" style="display:none">

  <!-- __WEMA_JS__ -->
  <script>
    (function() {
      // ---- IndexedDB helpers ----
      const DB_NAME = 'wema-standalone';
      const STORE_NAME = 'board';
      const DATA_KEY = 'current';

      function openDB() {
        return new Promise(function(resolve, reject) {
          var req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = function() {
            req.result.createObjectStore(STORE_NAME);
          };
          req.onsuccess = function() { resolve(req.result); };
          req.onerror = function() { reject(req.error); };
        });
      }

      function loadData(db) {
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(STORE_NAME, 'readonly');
          var store = tx.objectStore(STORE_NAME);
          var req = store.get(DATA_KEY);
          req.onsuccess = function() { resolve(req.result || null); };
          req.onerror = function() { reject(req.error); };
        });
      }

      function saveData(db, data) {
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(STORE_NAME, 'readwrite');
          var store = tx.objectStore(STORE_NAME);
          var req = store.put(data, DATA_KEY);
          req.onsuccess = function() { resolve(); };
          req.onerror = function() { reject(req.error); };
        });
      }

      // ---- App ----
      var saveTimer = null;

      async function init() {
        var db = await openDB();
        var container = document.getElementById('board-container');
        var savedData = await loadData(db);

        var savedTheme = localStorage.getItem('wema-theme') || 'default';

        var board = new Wema.WemaBoard({
          container: container,
          data: savedData || undefined,
          theme: savedTheme,
        });

        // Expose for debugging
        window.__board = board;

        var status = document.getElementById('status');

        function updateStatus() {
          var notes = board.getNotes().length;
          var edges = board.getEdges().length;
          status.textContent = 'Notes: ' + notes + (edges > 0 ? '  Edges: ' + edges : '');
        }
        updateStatus();

        // Auto-save with 300ms debounce (skip in viewOnly mode)
        board.on('change', function() {
          updateStatus();
          if (board.isViewOnly()) return;
          if (saveTimer) clearTimeout(saveTimer);
          saveTimer = setTimeout(function() {
            saveData(db, board.exportData());
          }, 300);
        });

        // Add note
        document.getElementById('btn-add').addEventListener('click', function() {
          var notes = board.getNotes();
          var offset = notes.length * 20;
          board.addNote({
            x: 120 + offset,
            y: 80 + offset,
          });
        });

        // Export
        document.getElementById('btn-export').addEventListener('click', function() {
          var data = board.exportData();
          var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'wema-board.json';
          a.click();
          URL.revokeObjectURL(url);
        });

        // Import
        var fileInput = document.getElementById('file-input');
        document.getElementById('btn-import').addEventListener('click', function() {
          fileInput.click();
        });
        fileInput.addEventListener('change', async function() {
          var file = fileInput.files[0];
          if (!file) return;
          var text = await file.text();
          var data = JSON.parse(text);
          board.importData(data);
          fileInput.value = '';
          // Save immediately
          await saveData(db, board.exportData());
          updateStatus();
        });

        // Lock toggle
        var btnLock = document.getElementById('btn-lock');
        var btnAdd = document.getElementById('btn-add');
        var lockIconLocked = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
        var lockIconUnlocked = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 5-5 5 5 0 0 1 5 5"/></svg>';
        function updateLockState() {
          var locked = board.isReadOnly();
          btnLock.innerHTML = locked ? (lockIconLocked + 'Unlock') : (lockIconUnlocked + 'Lock');
          if (locked) {
            btnLock.classList.add('locked');
          } else {
            btnLock.classList.remove('locked');
          }
          btnAdd.disabled = locked;
          status.textContent = (status.textContent || '').replace(/ *\[LOCKED\]/, '') + (locked ? ' [LOCKED]' : '');
        }
        btnLock.addEventListener('click', function() {
          // Mutual exclusion: turn off viewOnly if on
          if (board.isViewOnly()) {
            board.setViewOnly(false);
            updateViewOnlyState();
          }
          board.setReadOnly(!board.isReadOnly());
          updateLockState();
        });

        // Read Only toggle
        var btnViewOnly = document.getElementById('btn-viewonly');
        function updateViewOnlyState() {
          var vo = board.isViewOnly();
          if (vo) {
            btnViewOnly.classList.add('viewonly');
          } else {
            btnViewOnly.classList.remove('viewonly');
          }
          btnAdd.disabled = vo || board.isReadOnly();
          // Update status
          status.textContent = (status.textContent || '').replace(/ *\[READ ONLY\]/, '').replace(/ *\[LOCKED\]/, '');
          if (board.isReadOnly()) {
            status.textContent += ' [LOCKED]';
          } else if (vo) {
            status.textContent += ' [READ ONLY]';
          }
        }
        btnViewOnly.addEventListener('click', function() {
          // Mutual exclusion: turn off Lock if on
          if (board.isReadOnly()) {
            board.setReadOnly(false);
            updateLockState();
          }
          board.setViewOnly(!board.isViewOnly());
          updateViewOnlyState();
        });

        // Theme toggle
        var btnTheme = document.getElementById('btn-theme');
        var themeLabel = document.getElementById('theme-label');
        var themes = ['default', 'card'];
        function updateThemeLabel() {
          var t = board.getTheme();
          themeLabel.textContent = t.charAt(0).toUpperCase() + t.slice(1);
        }
        updateThemeLabel();
        btnTheme.addEventListener('click', function() {
          var current = board.getTheme();
          var idx = (themes.indexOf(current) + 1) % themes.length;
          board.setTheme(themes[idx]);
          localStorage.setItem('wema-theme', themes[idx]);
          updateThemeLabel();
        });

        // ---- Layout buttons ----
        var alignButtons = {
          'btn-align-left': 'left',
          'btn-align-center-h': 'center',
          'btn-align-right': 'right',
          'btn-align-top': 'top',
          'btn-align-middle-v': 'middle',
          'btn-align-bottom': 'bottom',
        };
        var btnDistH = document.getElementById('btn-dist-h');
        var btnDistV = document.getElementById('btn-dist-v');
        var btnAutoLayout = document.getElementById('btn-autolayout');

        // Collect all layout buttons for enabling/disabling
        var alignBtnEls = {};
        Object.keys(alignButtons).forEach(function(id) {
          alignBtnEls[id] = document.getElementById(id);
        });

        function updateLayoutButtons(selCount) {
          var hasTwo = selCount >= 2;
          var hasThree = selCount >= 3;
          Object.keys(alignBtnEls).forEach(function(id) {
            alignBtnEls[id].disabled = !hasTwo;
          });
          btnDistH.disabled = !hasThree;
          btnDistV.disabled = !hasThree;
          btnAutoLayout.disabled = board.getNotes().length < 2;
        }

        // Wire up align buttons
        Object.keys(alignButtons).forEach(function(id) {
          document.getElementById(id).addEventListener('click', function() {
            var sel = board.getSelection();
            if (sel.length >= 2) {
              board.alignNotes(sel, alignButtons[id]);
            }
          });
        });

        btnDistH.addEventListener('click', function() {
          var sel = board.getSelection();
          if (sel.length >= 3) board.distributeNotes(sel, 'horizontal');
        });
        btnDistV.addEventListener('click', function() {
          var sel = board.getSelection();
          if (sel.length >= 3) board.distributeNotes(sel, 'vertical');
        });
        btnAutoLayout.addEventListener('click', function() {
          board.autoLayout();
        });

        // Update button states when selection changes
        board.on('note:select', function(payload) {
          updateLayoutButtons(payload.noteIds.length);
        });

        // Also update when notes are added/removed
        board.on('change', function() {
          var sel = board.getSelection();
          updateLayoutButtons(sel.length);
        });

        // Initial state
        updateLayoutButtons(0);

        // ---- Undo / Redo ----
        var btnUndo = document.getElementById('btn-undo');
        var btnRedo = document.getElementById('btn-redo');
        board.on('history:change', function(payload) {
          btnUndo.disabled = !payload.canUndo;
          btnRedo.disabled = !payload.canRedo;
        });
        btnUndo.addEventListener('click', function() { board.undo(); });
        btnRedo.addEventListener('click', function() { board.redo(); });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
          // Ctrl/Cmd+A to select all
          if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
            if (document.activeElement && document.activeElement.closest && document.activeElement.closest('[contenteditable="true"]')) return;
            e.preventDefault();
            board.selectAll();
          }
          // Ctrl/Cmd+L to toggle lock
          if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'l') {
            e.preventDefault();
            if (board.isViewOnly()) {
              board.setViewOnly(false);
              updateViewOnlyState();
            }
            board.setReadOnly(!board.isReadOnly());
            updateLockState();
          }
          // Ctrl/Cmd+Shift+L to toggle read only
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'L') {
            e.preventDefault();
            if (board.isReadOnly()) {
              board.setReadOnly(false);
              updateLockState();
            }
            board.setViewOnly(!board.isViewOnly());
            updateViewOnlyState();
          }
        });
      }

      init().catch(console.error);
    })();
  </script>
</body>
</html>
